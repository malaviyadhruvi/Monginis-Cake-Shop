<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            color: #EC268F;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
        }
        .checkmark {
            font-size: 50px;
            color: white;
            background-color: #EC268F;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            animation: bounce 1s infinite alternate;
        }
        .redirect-message {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        button {
            background-color: #EC268F;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #d41e7e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✔</div>
        <h1>Order Successful!</h1>
        <p>Your order has been placed successfully.</p>
        <p>We will deliver your order soon!</p>
        <button onclick="window.location.href='/'">Back to Home</button>
        <p class="redirect-message">Redirecting to home in <span id="countdown">10</span> seconds...</p>
    </div>

    <script>
        let timeLeft = 10;
        const countdownElement = document.getElementById("countdown");

        function updateCountdown() {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                window.location.href = "/";
            }
        }

        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f1f4;
            text-align: center;
        }

		.search-bar {
            display: flex;
            margin: 20px;
            justify-content: center;
        }

        .search-bar input {
            width: 600px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
			margin-left:180px;
        }

        .search-bar button {
            padding: 10px 15px;
            background-color: #EC268F;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
			margin-left:30px;
			width:100px;
        }

        .hero {
            background: url('https://via.placeholder.com/1200x400') no-repeat center/cover;
            color: #fff;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0;
        }

        .hero p {
            font-size: 1.5rem;
            margin: 10px 0;
        }

        .hero button {
            padding: 15px 30px;
            background-color: #EC268F;
            border: none;
            font-size: 1rem;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .categories {
            padding: 50px 20px;
			
        }

        .categories h2 {
            color: #ff007a;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
			
        }

        .category {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .category img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .category:hover img {
            transform: scale(1.1);
        }

        .category:hover {
            transform: scale(1.05);
        }

        .category-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 10px 0;
            font-size: 1.2rem;
            text-transform: capitalize;
        }
    </style>
    </head>
<body>

<input type="text" placeholder="Search for cakes, pastries, cookies, etc.">
<button>Search</button>
<a href="cart.html" class="nav-item nav-link" style="font-size: 25px; display: inline-flex; align-items: center; justify-content: center; margin-left: 20px;">

</a>
</div>

            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">

        </div>
    </nav>
</div>
</body>

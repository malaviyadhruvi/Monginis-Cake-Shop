{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Categories</title>
	<link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/static/lib/animate/animate.min.css" rel="stylesheet">
    <link href="/static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">


    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f1f4;
            text-align: center;
        }

		.search-bar {
            display: flex;
            margin: 20px;
            justify-content: center;
        }

        .search-bar input {
            width: 600px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
			margin-left:180px;
        }

        .search-bar button {
            padding: 10px 15px;
            background-color: #EC268F;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
			margin-left:30px;
			width:100px;
        }

        .hero {
            background: url('https://via.placeholder.com/1200x400') no-repeat center/cover;
            color: #fff;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0;
        }

        .hero p {
            font-size: 1.5rem;
            margin: 10px 0;
        }

        .hero button {
            padding: 15px 30px;
            background-color:#EC268F;
            border: none;
            font-size: 1rem;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .categories {
            padding: 50px 20px;
			
        }

        .categories h2 {
            color: #ff007a;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
			
        }

        .category {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .category img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .category:hover img {
            transform: scale(1.1);
        }

        .category:hover {
            transform: scale(1.05);
        }

        .category-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 10px 0;
            font-size: 1.2rem;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
	
	<!-- Header Start -->
    {% include "header.html" %}
        <!-- Header End -->

	

    <section class="hero">
	<img src="/static/img/banner2.jpg">
    </section>

    <section class="categories">
        <h2 >Our Categories</h2>
        <div class="categories-grid">
            {% for product in products %}
            <div class="category">
                <a href="
                {% if product.name == 'Cakes' %}
                    {% url 'cake_list' %}
                {% elif product.name == 'Pastries' %}
                    {% url 'pastry_list' %}
                {% elif product.name == 'Packaged Cakes' %}
                    {% url 'packaged_cake_list' %}
                {% elif product.name == 'Brownie' %}
                    {% url 'brownie_list' %}
                {% elif product.name == 'Chocolate' %}
                    {% url 'chocolate_list' %}
                {% elif product.name == 'Donuts' %}
                    {% url 'donuts_list' %}
                {% elif product.name == 'Muffins' %}
                    {% url 'muffin_list' %}
                {% elif product.name == 'Chocolate Bouquet' %}
                    {% url 'chocolate_bouquet_list' %}
                

                {% endif %}
            ">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
                        <div class="category-title">
                            <div>{{ product.name }}</div>
                        </div>
        </a>
    </div>
{% endfor %}
        </div>
    </section>
	
<!-- footer start -->
{% include "footer.html" %}
<!-- footer end-->

</body>
</html>

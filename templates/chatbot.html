<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mongis Cake Shop</title>
    <style>
        /* Back to Top Button */
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* Chatbot Icon (above Back to Top) */
        #chat-icon {
            position: fixed;
            bottom: 75px; /* Positioned just above the back-to-top button */
            right: 20px;
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* Chatbot Popup Window */
        #chat-container {
            display: none;
            position: fixed;
            bottom: 120px; /* Appears above the chatbot icon */
            right: 20px;
            width: 300px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        /* Chat Header */
        #chat-header {
            background: #ff4081;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
        }

        /* Chat Messages */
        #chatbox {
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-size: 14px;
        }

        /* Input Area */
        #chat-input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #chat-input {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 5px;
        }

        #send-btn {
            background: #ff4081;
            color: white;
            border: none;
            padding: 6px;
            cursor: pointer;
            margin-left: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- Back to Top Button -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top">
        <i class="bi bi-arrow-up"></i>
    </a>

    <!-- Chatbot Floating Icon -->
    <button id="chat-icon" onclick="toggleChat()">💬</button>

    <!-- Chatbot Popup Window -->
    <div id="chat-container">
        <div id="chat-header">
            Mongis Cake Bot 
            <span style="float:right; cursor:pointer;" onclick="toggleChat()">✖</span>
        </div>
        <div id="chatbox"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Ask me about cakes..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function toggleChat() {
            let chatContainer = document.getElementById("chat-container");
            chatContainer.style.display = (chatContainer.style.display === "block") ? "none" : "block";
        }

        function sendMessage() {
            let userMessage = document.getElementById("chat-input").value.trim();
            if (userMessage === "") return;
    
            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<p><b>You:</b> ${userMessage}</p>`;
    
            fetch(`/chatbot/get-response/?message=${encodeURIComponent(userMessage)}`)
                .then(response => response.json())
                .then(data => {
                    chatbox.innerHTML += `<p><b>Monginis Bot:</b> ${data.response}</p>`;
    
                    // Display product details if available
                    if (data.products && data.products.length > 0) {
                        data.products.forEach(product => {
                            chatbox.innerHTML += `
                                <div style="border:1px solid #ddd; padding:10px; margin:5px 0; border-radius:8px;">
                                    <p><b>${product.name}</b></p>
                                    <img src="${product.image}" alt="${product.name}" style="width:100px; height:100px; border-radius:8px;">
                                    <p><b>Price:</b> ${product.price}</p>
                                </div>
                            `;
                        });
                    }
    
                    document.getElementById("chat-input").value = "";
                    chatbox.scrollTop = chatbox.scrollHeight;
                })
                .catch(error => {
                    console.error("Error fetching chatbot response:", error);
                    chatbox.innerHTML += `<p><b>Monginis Bot:</b> Sorry, there was an error fetching the response.</p>`;
                });
        }
        
    </script>

</body>
</html>
